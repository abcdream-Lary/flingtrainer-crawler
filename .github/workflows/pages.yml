name: pages

on:
  push:
    branches: [main]
  # 采集工作流完成后自动部署：crawl 用 GITHUB_TOKEN 提交数据，
  # 这类提交不会触发 push 事件（GitHub 递归防护），必须靠 workflow_run 兜住。
  workflow_run:
    workflows: ["crawl"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只保留一次部署，新部署取消进行中的旧部署
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          ref: main # workflow_run 触发时强制取 main，保证部署的是最新数据

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 以 main 分支上的最新采集数据重建 data.js，保证网站数据与仓库同步
      - name: 生成展示站数据
        run: python scripts/build_web_data.py

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传站点产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v4
