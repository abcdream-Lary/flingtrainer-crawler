name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 解析测试（基于真实页面快照）
        run: python -m pytest tests -q

      - name: 冒烟：抓取 2 个页面并导出
        run: python run.py crawl --mode full --limit 2 --no-screenshots

      - name: 校验导出产物
        run: |
          python - <<'PY'
          import json, sys
          data = json.load(open("data/json/trainers.json", encoding="utf-8"))
          assert data["count"] >= 1, "导出记录数不足"
          rec = data["records"][0]
          for field in ("url", "game_name", "game_version", "last_updated", "options", "downloads"):
              assert field in rec, f"缺少字段 {field}"
          print("导出校验通过：", data["count"], "条记录")
          PY
