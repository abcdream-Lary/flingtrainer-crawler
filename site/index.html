<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>风灵图鉴 · FLiNG Trainer Atlas</title>
<meta name="description" content="风灵月影修改器静态图鉴：中英文检索、分类筛选、完整历史版本浏览。数据每日自动采集自 flingtrainer.com。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230047E1'/%3E%3Cpath d='M20 46V18h24v6H27v6h14v6H27v10z' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-theme="light">

<!-- ======== 顶部导航 ======== -->
<header class="nav">
  <div class="shell nav-inner">
    <a class="brand" href="./" id="brand">
      <span class="brand-mark" aria-hidden="true">F</span>
      <span class="brand-text">
        <strong id="brandName">风灵图鉴</strong>
        <small id="brandSub">FLiNG Trainer Archive</small>
      </span>
    </a>

    <div class="search" role="search">
      <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 2a8 8 0 1 0 4.9 14.3l5.4 5.4 1.4-1.4-5.4-5.4A8 8 0 0 0 10 2zm0 2a6 6 0 1 1 0 12 6 6 0 0 1 0-12z"/></svg>
      <input id="searchInput" type="search" autocomplete="off" spellcheck="false"
             placeholder="搜索游戏：支持中英文" aria-label="搜索游戏">
      <button id="searchClear" class="search-clear" hidden aria-label="清除搜索">&times;</button>
      <kbd class="search-kbd">/</kbd>
    </div>

    <div class="nav-actions">
      <button id="themeToggle" class="icon-btn" title="切换深浅色" aria-label="切换深浅色">
        <svg class="ico-sun" viewBox="0 0 24 24"><path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0-5h0a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0V3a1 1 0 0 1 1-1zm0 18a1 1 0 0 1 1 1v2a1 1 0 1 1-2 0v-2a1 1 0 0 1 1-1zM2 11h2a1 1 0 1 1 0 2H2a1 1 0 1 1 0-2zm18 0h2a1 1 0 1 1 0 2h-2a1 1 0 1 1 0-2zM4.2 4.2l1.4 1.4A1 1 0 1 1 4.2 7L2.8 5.6a1 1 0 0 1 1.4-1.4zm14.2 14.2 1.4 1.4a1 1 0 1 1-1.4 1.4l-1.4-1.4a1 1 0 0 1 1.4-1.4zM19.8 4.2a1 1 0 0 1 0 1.4L18.4 7a1 1 0 1 1-1.4-1.4l1.4-1.4a1 1 0 0 1 1.4 0zM5.6 18.4 4.2 19.8a1 1 0 1 1-1.4-1.4l1.4-1.4a1 1 0 0 1 1.4 1.4z"/></svg>
        <svg class="ico-moon" viewBox="0 0 24 24"><path d="M20.7 14.9A8.5 8.5 0 0 1 9.1 3.3 9 9 0 1 0 20.7 14.9z"/></svg>
      </button>
      <button id="langToggle" class="lang-btn" title="Switch language">EN</button>
    </div>
  </div>
</header>

<!-- ======== Hero ======== -->
<section class="hero">
  <div class="hero-bg" aria-hidden="true"></div>
  <div class="shell hero-inner">
    <p class="hero-eyebrow" id="heroEyebrow">FLiNG Trainer Archive</p>
    <h1 class="hero-title" id="heroTitle">风灵月影修改器图鉴</h1>
    <p class="hero-lead" id="heroLead"></p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="#grid-top" id="heroCta">浏览全部</a>
      <a class="btn btn-ghost" href="https://github.com/abcdream-Lary/flingtrainer-crawler" target="_blank" rel="noopener" id="navRepo">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 0 0-2.5 15.6c.4.07.55-.17.55-.38l-.01-1.49c-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82a7.42 7.42 0 0 1 4 0c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48l-.01 2.2c0 .21.15.46.55.38A8 8 0 0 0 8 0z"/></svg>
        <span id="navRepoText">采集工程</span>
      </a>
    </div>
    <dl class="hero-stats" id="heroStats">
      <div class="stat"><dt id="statGames">收录游戏</dt><dd>—</dd></div>
      <div class="stat"><dt id="statOptions">功能选项</dt><dd>—</dd></div>
      <div class="stat"><dt id="statVersions">历史版本</dt><dd>—</dd></div>
      <div class="stat"><dt id="statUpdated">最近更新</dt><dd>—</dd></div>
    </dl>
  </div>
</section>

<!-- ======== 筛选栏 ======== -->
<main class="shell" id="grid-top">
  <div class="toolbar">
    <div class="toolbar-row cats" id="catChips" role="tablist" aria-label="分类"></div>
    <div class="toolbar-row sub">
      <div class="tag-scroller" id="tagChips" aria-label="标签"></div>
      <div class="toolbar-right">
        <span class="result-count" id="resultCount">0</span>
        <label class="sort">
          <span id="sortLabel">排序</span>
          <select id="sortSelect">
            <option value="recent">最近更新</option>
            <option value="options">选项最多</option>
            <option value="versions">版本最多</option>
            <option value="name">名称 A-Z</option>
          </select>
        </label>
      </div>
    </div>
  </div>

  <p class="load-error" id="loadError" hidden></p>

  <!-- ======== 卡片网格 ======== -->
  <section class="grid" id="grid" aria-live="polite"></section>

  <p class="empty" id="empty" hidden>
    <strong id="emptyTitle">没有匹配的游戏</strong>
    <span id="emptyLead">换个关键词或清除筛选试试。</span>
    <button class="btn btn-ghost" id="emptyReset">清除筛选</button>
  </p>

  <div class="sentinel" id="sentinel" hidden><span class="spinner" aria-hidden="true"></span><span id="loadingText">加载中…</span></div>
</main>

<!-- ======== 详情弹窗 ======== -->
<div class="modal" id="modal" hidden aria-modal="true" role="dialog">
  <div class="modal-mask" data-close></div>
  <div class="modal-panel">
    <button class="modal-close icon-btn" data-close aria-label="关闭">&times;</button>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<footer class="footer">
  <div class="shell">
    <p id="footerNote">本站为静态展示，数据由自动化爬虫每日采集自 flingtrainer.com。</p>
    <p id="footerRobots" class="footer-sub"></p>
  </div>
</footer>

<button class="to-top" id="toTop" hidden aria-label="回到顶部">↑</button>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/catalog.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
